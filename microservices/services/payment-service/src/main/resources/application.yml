spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/airline_payment_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8084
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.nara: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] - %logger{36} - %msg%n"

# Payment Gateway Configuration
payment:
  gateway:
    name: mock
    timeout: 30000
    retry-attempts: 3
    mock:
      success-rate: 0.85
